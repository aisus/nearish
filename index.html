<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>nearish</title>
    <meta
      name="description"
      content="Where in a city you are within reach of everything you want nearby: pick places and how far you will walk or cycle to each."
    />
    <!-- A link's preview. Its crawlers do not run scripts, so every link,
         a region's or a shared one, unfurls as the home screen. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="nearish" />
    <meta property="og:title" content="nearish" />
    <meta
      property="og:description"
      content="Where in a city you are within reach of everything you want nearby: pick places and how far you will walk or cycle to each."
    />
    <meta property="og:url" content="https://aisus.github.io/nearish/" />
    <meta property="og:image" content="https://aisus.github.io/nearish/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The nearish home screen: an overlap of reaches over central Berlin, and the regions to choose from."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
